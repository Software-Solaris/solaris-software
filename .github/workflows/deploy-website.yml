name: Deploy web
on:
  push:
    paths:
      - 'website/**'
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Montar la web
        run: |
          cd website
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
          .venv/bin/mkdocs build

      - name: Publicar en el servidor
        run: |
          rsync -av --delete website/site/ "/home/solaris/solaris-web/html/"