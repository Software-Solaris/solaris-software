site_name: SOFTWARE SOLARIS
site_description: Documentation for Solaris Software, the UVigo Aerotech rocketry avionics protocol.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - search.suggest
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/drawer-persist.js
  - javascripts/nav-new-tab.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Software-Solaris
      name: Software-Solaris on GitHub
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/uvigoaerotech/?hl=es
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/uvigo-aerotech/
    - icon: fontawesome/brands/tiktok
      link: https://www.tiktok.com/@uvigo_aerotech
    - icon: fontawesome/solid/envelope
      link: mailto:contacto@uvigoaerotech.com
    - icon: material/web
      link: https://uvigoaerotech.com/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Roadmap:
      - Planning: roadmap.md
  - Getting Started:
      - Philosophy behind the architecture: philosophy.md
      - Solaris Software with the use of AI: ai.md
      - Repositories structure: architecture.md
      - Build System (CMake): build-system.md
  - Solaris Packet Protocol:
      - SPP Layers: spp-layers.md
      - Reading the code: core-overview.md
      - Finite State Machine (FSM): fsm.md
      - HAL: hal.md
      - Publish-Suscribe (PUBSUB): pubsub.md
      - Solaris Packet: packet.md
      - Databank: databank.md
  - Services:
      - BMP390: services/bmp390.md
      - ICM20948: services/icm20948.md
      - Datalogger: services/datalogger.md
      - Databank: services/databank.md
      - Log: services/log.md
  - API (Doxygen): /doxygen/
  - GitHub:
      - Solaris Software: https://github.com/Software-Solaris/solaris-software
      - Solaris Packet Protocol: https://github.com/Software-Solaris/solaris-packet-protocol
