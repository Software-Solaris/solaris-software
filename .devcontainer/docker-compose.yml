services:
  solaris-development:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: solaris
        USER_UID: 1000
        USER_GID: 1000
    privileged: true
    user: solaris
    volumes:
      - ..:${HOME}/Documents/solaris-software:cached
      - ${HOME}/.ssh:/tmp/host-ssh:ro
      - ${HOME}/.gitconfig:/tmp/host-gitconfig:ro
    working_dir: /solaris
